# Render Blueprint: the Dhar website, one static site, from the `public/` folder of this repository.
#   Render dashboard -> New -> Blueprint -> pick this repository (branch main).
# The survey is a page of the website (public/survey/), so it is deployed with it: there is one site, one branch.
# `repo` and `branch` are left out on purpose: Render then uses the repository and branch the Blueprint is
# created from, so a renamed repository or a branch that does not exist can no longer make the Blueprint fail.
# There is nothing to build; the build command is a placeholder because Render requires one.
services:
  - type: web
    runtime: static
    name: dhar
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
