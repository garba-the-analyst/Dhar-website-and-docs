# Render Blueprint for the Dhar website (one static site; the survey is a page of it at /survey/).
#
#   Render dashboard -> New -> Blueprint -> pick this repository (Dhar-website-and-docs) -> Apply.
#
# `repo` and `branch` are left out on purpose: Render then uses the repository and branch you picked
# when you created the Blueprint. Nothing is built; the folder public/ is the site as it stands.
services:
  - type: web
    runtime: static
    name: dhar
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: ./public
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
